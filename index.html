<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body {
  font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", sans-serif;
  background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
  color: #333;
  padding: 20px 16px 40px;
  max-width: 480px;
  margin: 0 auto;
}
h1 { text-align: center; font-size: 22px; font-weight: 700; color: #fff; padding: 16px 0; }
.toc { background: #fff; border-radius: 10px; padding: 14px 16px; margin-bottom: 16px; }
.toc-title { font-size: 16px; font-weight: 700; color: #667eea; margin-bottom: 10px; padding-bottom: 6px; border-bottom: 2px solid #667eea; }
.toc-list { list-style: none; }
.toc-list li { padding: 8px 0; border-bottom: 1px solid #f0f0f0; }
.toc-list li:last-child { border-bottom: none; }
.toc-list a { color: #333; text-decoration: none; font-size: 15px; display: flex; align-items: center; }
.toc-list a::before { content: "♪"; color: #667eea; margin-right: 8px; }
.song-card { background: #fff; border-radius: 10px; padding: 16px 14px; margin-bottom: 16px; }
.song-title { font-size: 18px; font-weight: 700; color: #667eea; margin-bottom: 4px; }
.song-singer { font-size: 13px; color: #888; margin-bottom: 12px; }
.video-wrap { width: 100%; border-radius: 6px; overflow: hidden; background: #000; margin-bottom: 10px; position: relative; }
.video-wrap iframe { width: 100%; height: 220px; border: none; display: block; }
.video-placeholder { width: 100%; height: 220px; display: flex; align-items: center; justify-content: center; background: #1a1a2e; color: #fff; font-size: 15px; cursor: pointer; flex-direction: column; }
.video-placeholder .play-icon { font-size: 40px; margin-bottom: 8px; }
.footer { text-align: center; font-size: 12px; color: rgba(255,255,255,0.7); margin-top: 24px; }

/* 加载提示 */
.loading-overlay {
  position: fixed; top: 0; left: 0; right: 0; bottom: 0;
  background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
  display: flex; flex-direction: column; align-items: center; justify-content: center;
  z-index: 9999; transition: opacity 0.4s;
}
.loading-overlay.hidden { opacity: 0; pointer-events: none; }
.loading-spinner {
  width: 40px; height: 40px; border: 4px solid rgba(255,255,255,0.3);
  border-top-color: #fff; border-radius: 50%;
  animation: spin 0.8s linear infinite;
}
@keyframes spin { to { transform: rotate(360deg); } }
.loading-text { color: #fff; font-size: 16px; margin-top: 16px; }
</style>
</head>
<body>

<!-- 加载提示 -->
<div class="loading-overlay" id="loadingOverlay">

<script>
// 视频懒加载：点击占位符才加载iframe
document.querySelectorAll('.video-placeholder').forEach(function(ph) {
  ph.addEventListener('click', function() {
    var src = this.getAttribute('data-src');
    if (!src) return;
    var iframe = document.createElement('iframe');
    iframe.src = src;
    iframe.scrolling = 'no';
    iframe.frameBorder = '0';
    iframe.allowFullscreen = true;
    this.parentNode.replaceChild(iframe, this);
  });
});

// 加载提示：页面渲染完成后淡出
window.addEventListener('load', function() {
  var overlay = document.getElementById('loadingOverlay');
  if (overlay) {
    overlay.classList.add('hidden');
    setTimeout(function() { overlay.style.display = 'none'; }, 500);
  }
});
// 兜底：2秒后也隐藏
setTimeout(function() {
  var overlay = document.getElementById('loadingOverlay');
  if (overlay && !overlay.classList.contains('hidden')) {
    overlay.classList.add('hidden');
    setTimeout(function() { overlay.style.display = 'none'; }, 500);
  }
}, 2000);
</script>
